apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clothes-ingress
  namespace: clothes-store
spec:
  ingressClassName: nginx
  rules:
    - host: clothes.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clothes-app
                port: { number: 80 }
