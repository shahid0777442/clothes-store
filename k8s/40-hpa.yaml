apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clothes-app-hpa
  namespace: clothes-store
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clothes-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
