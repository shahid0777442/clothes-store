<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clothes Store</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#fafafa}
header{background:#111;color:#fff;padding:16px 24px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:24px}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px;text-align:center}
.card .e{font-size:56px}button{padding:8px 14px;border:0;border-radius:6px;background:#111;color:#fff;cursor:pointer}
#cart{padding:0 24px 24px}
</style></head><body>
<header><h2>👗 Clothes Store</h2><div>Cart: <b id="count">0</b></div></header>
<div class="grid" id="products"></div>
<div id="cart"><h3>Your Cart</h3><ul id="items"></ul><p>Total: Rs <b id="total">0</b></p>
<input id="name" placeholder="Your name"> <button onclick="checkout()">Place Order</button></div>
<script>
let cart=[];
async function load(){
  const p=await (await fetch('/api/products')).json();
  document.getElementById('products').innerHTML=p.map(x=>`<div class="card"><div class="e">${x.image}</div><h4>${x.name}</h4><p>${x.category} · Rs ${x.price}</p><button onclick='add(${JSON.stringify({productId:x._id,name:x.name,price:x.price})})'>Add to cart</button></div>`).join('');
}
function add(i){const f=cart.find(c=>c.productId===i.productId);f?f.qty++:cart.push({...i,qty:1});render();}
function render(){
  document.getElementById('count').textContent=cart.reduce((s,c)=>s+c.qty,0);
  document.getElementById('items').innerHTML=cart.map(c=>`<li>${c.name} x${c.qty}</li>`).join('');
  document.getElementById('total').textContent=cart.reduce((s,c)=>s+c.qty*c.price,0);
}
async function checkout(){
  const customer=document.getElementById('name').value;
  const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer,items:cart})});
  if(r.ok){alert('Order placed!');cart=[];render();}else alert('Name aur items zaroori hain');
}
load();
</script></body></html>
